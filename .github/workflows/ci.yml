name: EgonarMarket CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check apps/api/src/server.js
      - run: node --check apps/api/src/auth.js
      - run: node --check apps/api/src/db.js
      - run: node --check apps/api/src/seed.js
      - run: node --check apps/web/app.js

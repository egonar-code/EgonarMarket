<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Administration - EgonarMarket</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <nav class="navbar">

            <div class="logo">
                Egonar<span>Market</span>
            </div>

            <a href="index.html" class="cart">
                Voir la boutique
            </a>

        </nav>

    </header>


    <main class="container">

        <h1 class="section-title">
            Tableau de bord
        </h1>


        <div class="admin-stats">

            <div class="admin-card">

                <h3>
                    Commandes
                </h3>

                <p id="total-orders">
                    0
                </p>

            </div>


            <div class="admin-card">

                <h3>
                    Chiffre d'affaires
                </h3>

                <p id="total-sales">
                    0 FCFA
                </p>

            </div>

        </div>


        <h2 class="admin-title">
            Commandes récentes
        </h2>


        <div id="admin-orders">
        </div>
<h2 class="admin-title">
    Gestion des produits
</h2>

<div class="admin-product-form">

    <h3>Ajouter un produit</h3>

    <form id="product-form">

        <label for="product-name">
            Nom du produit
        </label>

        <input
            type="text"
            id="product-name"
            placeholder="Nom du produit"
            required
        >

        <label for="product-price">
            Prix
        </label>

        <input
            type="number"
            id="product-price"
            placeholder="Prix en FCFA"
            required
        >

        <label for="product-category">
            Catégorie
        </label>

        <input
            type="text"
            id="product-category"
            placeholder="Ex : Mode, Maison, Électronique..."
            required
        >

        <label for="product-description">
            Description
        </label>

        <textarea
            id="product-description"
            placeholder="Description du produit"
            required
        ></textarea>

        <label for="product-image">
            Image du produit
        </label>

        <input
            type="text"
            id="product-image"
            placeholder="exemple.jpg"
            required
        >

        <label for="product-stock">
            Stock
        </label>

        <input
            type="number"
            id="product-stock"
            placeholder="Quantité disponible"
            min="0"
            required
        >

        <button type="submit" class="btn">
            Ajouter le produit
        </button>

    </form>

</div>

<h3>Produits enregistrés</h3>

<div id="admin-products">
</div>

    </main>


    <script src="script.js"></script>

</body>

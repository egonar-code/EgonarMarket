<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration — EgonarMarket</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><div class="nav wrap"><a class="logo" href="index.html">Egonar<span>Market</span></a><a href="index.html">Voir la boutique</a></div></header><main class="wrap section"><p class="eyebrow">ESPACE ADMIN</p><h1>Tableau de bord</h1><section id="login"><form id="lf" class="form narrow"><input name="email" type="email" placeholder="Email administrateur" required><input name="password" type="password" placeholder="Mot de passe" required><button class="btn primary">Connexion</button></form><div id="login-msg"></div></section><section id="panel" style="display:none"><div class="admin-stats"><div><span>Commandes</span><strong id="orders-count">0</strong></div><div><span>CA</span><strong id="sales-count">0 FCFA</strong></div><div><span>Produits</span><strong id="products-count">0</strong></div><div><span>Stock faible</span><strong id="low-stock">0</strong></div></div><div class="admin-grid"><section><h2>Ajouter un produit</h2><form id="pf" class="form"><input name="name" placeholder="Nom" required><input name="category" placeholder="Catégorie" required><input name="price_fcfa" type="number" min="0" placeholder="Prix FCFA" required><input name="stock" type="number" min="0" placeholder="Stock" required><input name="image_url" placeholder="URL image"><textarea name="description" placeholder="Description"></textarea><button class="btn primary">Ajouter</button></form></section><section><h2>Produits</h2><div id="products-admin"></div></section></div><section><h2>Commandes</h2><div id="orders-admin"></div></section></section></main><script>
const API='/api';const j=(u,o={})=>fetch(API+u,{credentials:'include',...o}).then(async r=>({ok:r.ok,data:await r.json().catch(()=>({}))}));const money=n=>new Intl.NumberFormat('fr-FR').format(Number(n)||0)+' FCFA';
async function boot(){const r=await j('/admin/me');if(r.ok){login.style.display='none';panel.style.display='block';refresh()}else login.style.display='block'}boot();
lf.onsubmit=async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(lf));const r=await j('/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)return login-msg.textContent=r.data.error||'Connexion impossible';location.reload()};
pf.onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(pf));b.price_fcfa=Number(b.price_fcfa);b.stock=Number(b.stock);const r=await j('/admin/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok)return alert(r.data.error||'Erreur');pf.reset();refresh()};
async function refresh(){const [p,o]=await Promise.all([j('/admin/products'),j('/admin/orders')]);const ps=p.data||[],os=o.data||[];document.getElementById('products-count').textContent=ps.length;document.getElementById('orders-count').textContent=os.length;document.getElementById('sales-count').textContent=money(os.reduce((s,x)=>s+Number(x.total_fcfa||0),0));document.getElementById('low-stock').textContent=ps.filter(x=>Number(x.stock)<=3&&x.active).length;document.getElementById('products-admin').innerHTML=ps.map(x=>`<div class="admin-row"><span><b>${x.name}</b><small>${money(x.price_fcfa)} · stock ${x.stock}</small></span><span><button onclick="editStock('${x.id}',${x.stock})">Stock</button><button onclick="hideProduct('${x.id}')">${x.active?'Masquer':'Inactif'}</button></span></div>`).join('')||'<p class="muted">Aucun produit.</p>';document.getElementById('orders-admin').innerHTML=os.map(x=>`<div class="admin-row"><span><b>${x.order_number}</b><small>${x.customer_name} · ${money(x.total_fcfa)}</small></span><select onchange="setStatus('${x.id}',this.value)">${['CONFIRMEE','PREPARATION','EXPEDIEE','EN_LIVRAISON','LIVREE','ANNULEE'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></div>`).join('')||'<p class="muted">Aucune commande.</p>'}
async function editStock(id,current){const value=prompt('Nouveau stock',current);if(value===null)return;await j('/admin/products/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({stock:Number(value)})});refresh()};async function hideProduct(id){await j('/admin/products/'+id,{method:'DELETE'});refresh()};async function setStatus(id,status){await j('/admin/orders/'+id+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});refresh()}
</script></body></html>

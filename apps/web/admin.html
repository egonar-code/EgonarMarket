<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Administration EgonarMarket"><title>Administration — EgonarMarket</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><div class="nav wrap"><a class="logo" href="index.html">Egonar<span>Market</span></a><nav><a href="index.html">Boutique</a><a href="suivi.html">Suivi</a></nav></div></header><main class="wrap section"><div class="admin-head"><div><p class="eyebrow">ESPACE ADMIN</p><h1>Tableau de bord</h1></div><button id="logout" class="btn secondary" type="button" hidden>Déconnexion</button></div><section id="login"><form id="lf" class="form narrow"><input name="email" type="email" autocomplete="username" placeholder="Email administrateur" required><input name="password" type="password" autocomplete="current-password" placeholder="Mot de passe" required><button class="btn primary">Connexion</button></form><div id="login-msg" class="state error" hidden></div></section><section id="panel" style="display:none"><div class="admin-stats"><div><span>Commandes</span><strong id="orders-count">0</strong></div><div><span>CA des commandes</span><strong id="sales-count">0 FCFA</strong></div><div><span>Produits actifs</span><strong id="products-count">0</strong></div><div><span>Stock faible</span><strong id="low-stock">0</strong></div></div><div class="admin-grid"><section><h2>Ajouter un produit</h2><form id="pf" class="form"><input name="name" maxlength="120" placeholder="Nom" required><input name="category" maxlength="80" placeholder="Catégorie" required><input name="subcategory" maxlength="80" placeholder="Sous-catégorie"><input name="price_fcfa" type="number" min="0" placeholder="Prix FCFA" required><input name="old_price_fcfa" type="number" min="0" placeholder="Ancien prix (facultatif)"><input name="stock" type="number" min="0" placeholder="Stock" required><input name="sku" maxlength="60" placeholder="SKU (facultatif)"><input name="image_url" placeholder="URL image"><textarea name="description" maxlength="2000" placeholder="Description"></textarea><button class="btn primary">Ajouter le produit</button></form><div id="product-msg"></div></section><section><div class="section-head"><div><h2>Produits</h2><p id="product-filter-summary" class="muted"></p></div><input id="product-filter" class="admin-filter" placeholder="Rechercher…"></div><div id="products-admin"></div></section></div><section><div class="section-head"><div><h2>Commandes</h2><p id="order-filter-summary" class="muted"></p></div><input id="order-filter" class="admin-filter" placeholder="N° commande, client…"></div><div id="orders-admin"></div></section></section></main><script>
const API='/api', $=id=>document.getElementById(id), money=n=>new Intl.NumberFormat('fr-FR').format(Number(n)||0)+' FCFA';let products=[],orders=[];const STATUSES=['EN_ATTENTE_PAIEMENT','CONFIRMEE','PREPARATION','EXPEDIEE','EN_LIVRAISON','LIVREE','ANNULEE'];const LABELS={EN_ATTENTE_PAIEMENT:'En attente de paiement',CONFIRMEE:'Confirmée',PREPARATION:'En préparation',EXPEDIEE:'Expédiée',EN_LIVRAISON:'En livraison',LIVREE:'Livrée',ANNULEE:'Annulée'};const j=(u,o={})=>fetch(API+u,{credentials:'include',...o}).then(async r=>({ok:r.ok,data:await r.json().catch(()=>({}))}));
async function boot(){const r=await j('/admin/me');if(r.ok){$('login').style.display='none';$('panel').style.display='block';$('logout').hidden=false;refresh()}else $('login-msg').hidden=false}boot();
$('lf').onsubmit=async e=>{e.preventDefault();const r=await j('/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData($('lf'))))});if(!r.ok){$('login-msg').textContent=r.data.error||'Connexion impossible';$('login-msg').hidden=false;return}location.reload()};$('logout').onclick=async()=>{await j('/admin/logout',{method:'POST'});location.reload()};
$('pf').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData($('pf')));for(const k of ['price_fcfa','old_price_fcfa','stock'])b[k]=b[k]===''?null:Number(b[k]);const r=await j('/admin/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok){$('product-msg').textContent=r.data.error||'Erreur';$('product-msg').className='state error';return}$('product-msg').textContent='Produit ajouté.';$('product-msg').className='state success';$('pf').reset();refresh()};
function drawProducts(){const q=$('product-filter').value.trim().toLowerCase();const list=products.filter(x=>(x.name+' '+x.category+' '+(x.sku||'')).toLowerCase().includes(q));$('product-filter-summary').textContent=`${list.length} produit${list.length>1?'s':''}`;$('products-admin').innerHTML=list.map(x=>`<div class="admin-row"><span><b>${x.name}</b><small>${money(x.price_fcfa)} · stock ${x.stock} · ${x.active?'actif':'masqué'}</small></span><span><button onclick="editProduct('${x.id}')">Modifier</button><button onclick="toggleProduct('${x.id}',${x.active})">${x.active?'Masquer':'Activer'}</button></span></div>`).join('')||'<p class="muted">Aucun produit.</p>'}
function drawOrders(){const q=$('order-filter').value.trim().toLowerCase();const list=orders.filter(x=>(x.order_number+' '+(x.customer_name||'')+' '+(x.phone||'')).toLowerCase().includes(q));$('order-filter-summary').textContent=`${list.length} commande${list.length>1?'s':''}`;$('orders-admin').innerHTML=list.map(x=>`<div class="admin-row"><span><b>${x.order_number}</b><small>${x.customer_name} · ${x.phone||''} · ${money(x.total_fcfa)}</small></span><select onchange="setStatus('${x.id}',this.value)" aria-label="Statut de ${x.order_number}">${STATUSES.map(s=>`<option value="${s}" ${x.status===s?'selected':''}>${LABELS[s]}</option>`).join('')}</select></div>`).join('')||'<p class="muted">Aucune commande.</p>'}
async function refresh(){const [p,o]=await Promise.all([j('/admin/products'),j('/admin/orders')]);if(!p.ok||!o.ok)return alert('Session administrateur expirée.');products=p.data||[];orders=o.data||[];$('products-count').textContent=products.filter(x=>x.active).length;$('orders-count').textContent=orders.length;$('sales-count').textContent=money(orders.filter(x=>x.status!=='ANNULEE').reduce((s,x)=>s+Number(x.total_fcfa||0),0));$('low-stock').textContent=products.filter(x=>x.active&&Number(x.stock)<=3).length;drawProducts();drawOrders()}
async function editProduct(id){const p=products.find(x=>x.id===id);if(!p)return;const name=prompt('Nom',p.name);if(name===null)return;const price=prompt('Prix FCFA',p.price_fcfa);if(price===null)return;const stock=prompt('Stock',p.stock);if(stock===null)return;const category=prompt('Catégorie',p.category);if(category===null)return;const r=await j('/admin/products/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.trim(),price_fcfa:Number(price),stock:Math.max(0,Number(stock)),category:category.trim()})});if(!r.ok)return alert(r.data.error||'Modification impossible.');refresh()}
async function toggleProduct(id,active){const r=active?await j('/admin/products/'+id,{method:'DELETE'}):await j('/admin/products/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({active:true})});if(!r.ok)return alert(r.data.error||'Opération impossible.');refresh()}
async function setStatus(id,status){const r=await j('/admin/orders/'+id+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});if(!r.ok)alert(r.data.error||'Statut impossible.');refresh()}
$('product-filter').oninput=drawProducts;$('order-filter').oninput=drawOrders;
</script></body></html>

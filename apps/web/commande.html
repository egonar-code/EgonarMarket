<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Commande — EgonarMarket</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><div class="nav wrap"><a class="logo" href="index.html">Egonar<span>Market</span></a><a href="panier.html">← Panier</a></div></header><main class="wrap section"><div class="checkout"><section><p class="eyebrow">CHECKOUT</p><h1>Finaliser ma commande</h1><form id="form" class="form"><input required name="name" placeholder="Nom complet"><input required name="phone" placeholder="Téléphone / WhatsApp"><input name="email" type="email" placeholder="Email (facultatif)"><input required name="address" placeholder="Adresse, quartier, repère"><input name="city" value="Dakar" placeholder="Ville"><select name="payment_method"><option value="A_PAYER">Paiement à confirmer</option><option value="WAVE">Wave</option><option value="ORANGE_MONEY">Orange Money</option><option value="LIVRAISON">Paiement à la livraison</option></select><button class="btn primary" type="submit">Confirmer la commande</button></form><div id="msg"></div></section><aside class="summary-card"><h2>Votre commande</h2><div id="summary"></div></aside></div></main><script>
const API='/api';const money=n=>new Intl.NumberFormat('fr-FR').format(Number(n)||0)+' FCFA';const form=document.getElementById('form');const c=()=>JSON.parse(localStorage.getItem('egonarCart')||'[]');function summary(){const x=c(),s=x.reduce((a,i)=>a+i.price_fcfa*i.quantity,0);document.getElementById('summary').innerHTML=x.length?x.map(i=>`<div class="summary-line"><span>${i.name} × ${i.quantity}</span><strong>${money(i.price_fcfa*i.quantity)}</strong></div>`).join('')+`<hr><div class="summary-line"><strong>Total</strong><strong>${money(s)}</strong></div>`:'<p>Panier vide.</p>'}summary();form.onsubmit=async e=>{e.preventDefault();const items=c().map(i=>({product_id:i.product_id,quantity:i.quantity}));if(!items.length)return alert('Panier vide.');const customer=Object.fromEntries(new FormData(form));const r=await fetch(API+'/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer,items,payment_method:customer.payment_method})});const d=await r.json();if(!r.ok)return document.getElementById('msg').innerHTML=`<div class="state error">${d.error||'Commande impossible.'}</div>`;localStorage.removeItem('egonarCart');form.style.display='none';document.getElementById('msg').innerHTML=`<div class="success"><h2>Commande ${d.order_number}</h2><p>Votre commande est enregistrée. Conservez ce numéro pour le suivi.</p><a class="btn primary" href="suivi.html?order=${encodeURIComponent(d.order_number)}">Suivre ma commande</a></div>`};
</script></body></html>

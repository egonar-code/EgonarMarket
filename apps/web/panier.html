<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panier — EgonarMarket</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><div class="nav wrap"><a class="logo" href="index.html">Egonar<span>Market</span></a><nav><a href="index.html">Boutique</a><a href="suivi.html">Suivre</a></nav></div></header><main class="wrap section"><div class="section-head"><div><p class="eyebrow">VOTRE SÉLECTION</p><h1>Panier</h1><p id="cart-status" class="muted"></p></div></div><div id="cart"></div><div id="summary"></div></main><footer><p class="copyright">© 2026 EgonarMarket · Sénégal</p></footer><script>
const API='/api';const money=n=>new Intl.NumberFormat('fr-FR').format(Number(n)||0)+' FCFA';const read=()=>{try{return JSON.parse(localStorage.getItem('egonarCart')||'[]')}catch{return[]}};const save=c=>localStorage.setItem('egonarCart',JSON.stringify(c));
async function load(){const c=read(),box=document.getElementById('cart'),sum=document.getElementById('summary'),status=document.getElementById('cart-status');if(!c.length){box.innerHTML='<div class="empty-state"><h3>Votre panier est vide</h3><p>Ajoutez un produit pour commencer.</p><a class="btn primary" href="index.html#produits">Continuer mes achats</a></div>';sum.innerHTML='';if(status)status.textContent='';return}if(status)status.textContent='Vérification du stock…';const checked=[];for(const item of c){try{const r=await fetch(API+'/products/'+encodeURIComponent(item.product_id));if(r.ok){const p=await r.json();const stock=Number(p.stock||0),quantity=Math.min(Math.max(1,Number(item.quantity)||1),Math.max(0,stock));checked.push({...item,name:p.name,price_fcfa:Number(p.price_fcfa),image_url:p.image_url||'',quantity})}}catch{checked.push(item)}}const clean=checked.filter(x=>Number(x.quantity)>0);save(clean);if(status)status.textContent='';if(!clean.length){box.innerHTML='<div class="empty-state"><h3>Les produits ne sont plus disponibles</h3><p>Votre panier a été mis à jour avec le stock actuel.</p><a class="btn primary" href="index.html#produits">Retour à la boutique</a></div>';sum.innerHTML='';return}box.innerHTML=clean.map((x,i)=>`<article class="cart-line"><img src="${x.image_url||''}" alt="${x.name||''}" loading="lazy"><div class="cart-info"><h3>${x.name}</h3><p>${money(x.price_fcfa)}</p><div class="qty"><button type="button" onclick="qty(${i},-1)" aria-label="Diminuer">−</button><strong>${x.quantity}</strong><button type="button" onclick="qty(${i},1)" aria-label="Augmenter">+</button><button class="link-btn" type="button" onclick="del(${i})">Supprimer</button></div></div><strong>${money(x.price_fcfa*x.quantity)}</strong></article>`).join('');const total=clean.reduce((s,x)=>s+Number(x.price_fcfa)*Number(x.quantity),0);sum.innerHTML=`<div class="cart-summary"><strong>Total</strong><strong>${money(total)}</strong></div><p class="muted">Le prix et le stock définitifs sont revérifiés sur le serveur lors de la commande.</p><a class="btn primary" href="commande.html">Passer la commande</a>`}
async function qty(i,d){const c=read();if(!c[i])return;if(d>0){try{const r=await fetch(API+'/products/'+encodeURIComponent(c[i].product_id));const p=await r.json();if(!r.ok||Number(c[i].quantity)>=Number(p.stock||0))return alert('Stock maximum atteint.')}catch{return alert('Impossible de vérifier le stock. Réessayez.')}}c[i].quantity+=d;if(c[i].quantity<1)c.splice(i,1);save(c);load()}function del(i){const c=read();c.splice(i,1);save(c);load()}load();
</script></body></html>

<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panier — EgonarMarket</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><div class="nav wrap"><a class="logo" href="index.html">Egonar<span>Market</span></a><nav><a href="index.html">Boutique</a><a href="suivi.html">Suivre</a></nav></div></header><main class="wrap section"><div class="section-head"><div><p class="eyebrow">VOTRE SÉLECTION</p><h1>Panier</h1></div></div><div id="cart"></div><div id="summary"></div></main><footer><p class="copyright">© 2026 EgonarMarket · Sénégal</p></footer><script>
const API='/api';const money=n=>new Intl.NumberFormat('fr-FR').format(Number(n)||0)+' FCFA';const read=()=>JSON.parse(localStorage.getItem('egonarCart')||'[]');const save=c=>localStorage.setItem('egonarCart',JSON.stringify(c));
function load(){const c=read(),box=document.getElementById('cart'),sum=document.getElementById('summary');if(!c.length){box.innerHTML='<div class="empty-state"><h3>Votre panier est vide</h3><p>Ajoutez un produit pour commencer.</p><a class="btn primary" href="index.html#produits">Continuer mes achats</a></div>';sum.innerHTML='';return}box.innerHTML=c.map((x,i)=>`<article class="cart-line"><img src="${x.image_url||''}" alt="${x.name||''}"><div class="cart-info"><h3>${x.name}</h3><p>${money(x.price_fcfa)}</p><div class="qty"><button onclick="qty(${i},-1)">−</button><strong>${x.quantity}</strong><button onclick="qty(${i},1)">+</button><button class="link-btn" onclick="del(${i})">Supprimer</button></div></div><strong>${money(x.price_fcfa*x.quantity)}</strong></article>`).join('');const total=c.reduce((s,x)=>s+Number(x.price_fcfa)*Number(x.quantity),0);sum.innerHTML=`<div class="cart-summary"><strong>Total</strong><strong>${money(total)}</strong></div><a class="btn primary" href="commande.html">Passer la commande</a>`}
function qty(i,d){const c=read();if(!c[i])return;c[i].quantity+=d;if(c[i].quantity<1)c.splice(i,1);save(c);load()}function del(i){const c=read();c.splice(i,1);save(c);load()}load();
</script></body></html>

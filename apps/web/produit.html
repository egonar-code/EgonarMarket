<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Fiche produit EgonarMarket"><title>Produit — EgonarMarket</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><div class="nav wrap"><a class="logo" href="index.html">Egonar<span>Market</span></a><nav><a href="index.html#produits">Boutique</a><a href="suivi.html">Suivre</a><a href="panier.html">🛒 Panier <b id="cart-count">0</b></a></nav></div></header><main class="wrap section"><div id="product-view" class="product-detail"><div class="empty-state"><h3>Chargement…</h3><p>Nous préparons la fiche produit.</p></div></div></main><footer><p class="copyright">© 2026 EgonarMarket · Sénégal</p></footer><script>
const API='/api';const money=n=>new Intl.NumberFormat('fr-FR').format(Number(n)||0)+' FCFA';const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const cart=()=>{try{return JSON.parse(localStorage.getItem('egonarCart')||'[]')}catch{return[]}};const save=c=>{localStorage.setItem('egonarCart',JSON.stringify(c));update()};const update=()=>{const e=document.getElementById('cart-count');if(e)e.textContent=cart().reduce((s,x)=>s+Number(x.quantity||0),0)};
async function boot(){const id=new URLSearchParams(location.search).get('id'),box=document.getElementById('product-view');if(!id){box.innerHTML='<div class="empty-state"><h3>Produit introuvable</h3><p>Le produit demandé n’existe pas.</p></div>';return}try{const r=await fetch(API+'/products/'+encodeURIComponent(id));const p=await r.json();if(!r.ok)throw new Error(p.error||'Produit introuvable');const stock=Number(p.stock||0),old=Number(p.old_price_fcfa||0);box.innerHTML=`<div class="detail-image">${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}">`:'<div class="image-placeholder">EgonarMarket</div>'}</div><div class="detail-copy"><span class="badge">${esc(p.category||'Produit')}</span><h1>${esc(p.name)}</h1><p class="lead">${esc(p.description||'')}</p><div class="price-stack"><strong class="detail-price">${money(p.price_fcfa)}</strong>${old>Number(p.price_fcfa)?`<span class="old-price">${money(old)}</span>`:''}</div><p class="stockline ${stock<=3?'stock-low':''}">${stock>0?(stock<=3?`Plus que ${stock} disponible(s)`:`En stock · ${stock} disponible(s)`):'Rupture de stock'}</p><button class="btn primary" id="add" ${stock<=0?'disabled':''}>${stock>0?'Ajouter au panier':'Rupture de stock'}</button><a class="btn secondary" href="https://wa.me/?text=${encodeURIComponent('Bonjour EgonarMarket, je suis intéressé(e) par : '+p.name)}" target="_blank" rel="noopener">Contacter via WhatsApp</a></div>`;document.getElementById('add')?.addEventListener('click',()=>{const c=cart(),row=c.find(x=>String(x.product_id)===String(p.id));if(row){if(row.quantity>=stock)return alert('Stock maximum atteint.');row.quantity++}else c.push({product_id:p.id,name:p.name,price_fcfa:Number(p.price_fcfa),image_url:p.image_url||'',quantity:1});save(c);alert('Produit ajouté au panier.')});update()}catch(e){box.innerHTML=`<div class="empty-state"><h3>Impossible de charger le produit</h3><p>${esc(e.message)}</p><a class="btn primary" href="index.html">Retour à la boutique</a></div>`}}boot();
</script></body></html>

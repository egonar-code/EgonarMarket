<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Fiche produit EgonarMarket"><title>Produit — EgonarMarket</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><div class="nav wrap"><a class="logo" href="index.html">Egonar<span>Market</span></a><nav><a href="index.html#produits">Boutique</a><a href="panier.html">🛒 Panier <b id="cart-count">0</b></a></nav></div></header><main class="wrap section"><div id="product-view" class="product-detail"><div class="empty-state"><h3>Chargement…</h3></div></div></main><footer><p class="copyright">© 2026 EgonarMarket · Sénégal</p></footer><script>
const API='/api';const money=n=>new Intl.NumberFormat('fr-FR').format(Number(n)||0)+' FCFA';const cart=()=>JSON.parse(localStorage.getItem('egonarCart')||'[]');const save=c=>{localStorage.setItem('egonarCart',JSON.stringify(c));update()};const update=()=>{const e=document.getElementById('cart-count');if(e)e.textContent=cart().reduce((s,x)=>s+Number(x.quantity||0),0)};
async function boot(){const id=new URLSearchParams(location.search).get('id');const box=document.getElementById('product-view');if(!id){box.innerHTML='<div class="empty-state"><h3>Produit introuvable</h3></div>';return}try{const r=await fetch(API+'/products/'+encodeURIComponent(id));const p=await r.json();if(!r.ok)throw new Error(p.error);box.innerHTML=`<div class="detail-image">${p.image_url?`<img src="${p.image_url}" alt="${p.name}">`:''}</div><div class="detail-copy"><span class="badge">${p.category}</span><h1>${p.name}</h1><p class="lead">${p.description}</p><strong class="detail-price">${money(p.price_fcfa)}</strong><p class="stockline">${Number(p.stock)>0?`En stock · ${p.stock} disponible(s)`:'Rupture de stock'}</p><button class="btn primary" id="add" ${Number(p.stock)<=0?'disabled':''}>Ajouter au panier</button></div>`;document.getElementById('add')?.addEventListener('click',()=>{const c=cart();const row=c.find(x=>x.product_id===p.id);if(row){if(row.quantity>=p.stock)return alert('Stock maximum atteint.');row.quantity++}else c.push({product_id:p.id,name:p.name,price_fcfa:Number(p.price_fcfa),image_url:p.image_url,quantity:1});save(c);alert('Produit ajouté au panier.')});update()}catch(e){box.innerHTML=`<div class="empty-state"><h3>Impossible de charger le produit</h3><p>${e.message}</p></div>`}}boot();
</script></body></html>

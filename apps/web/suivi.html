<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Suivi de commande EgonarMarket"><title>Suivi — EgonarMarket</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><div class="nav wrap"><a class="logo" href="index.html">Egonar<span>Market</span></a><nav><a href="index.html">Boutique</a><a href="panier.html">Panier</a></nav></div></header><main class="wrap section"><p class="eyebrow">SUIVI</p><h1>Suivre ma commande</h1><form id="f" class="search track-search"><input id="n" autocomplete="off" placeholder="Ex. EG-20260910-ABC123" required><button>Rechercher</button></form><div id="out" class="track-out"></div></main><script>
const API='/api',L=()=>localStorage.getItem('egonar_language')==='en',T=(fr,en)=>L()?en:fr,q=new URLSearchParams(location.search).get('order'),labels={CONFIRMEE:T('Commande confirmée','Order confirmed'),PREPARATION:T('En préparation','Preparing'),EXPEDIEE:T('Expédiée','Shipped'),EN_LIVRAISON:T('En livraison','Out for delivery'),LIVREE:T('Livrée','Delivered'),ANNULEE:T('Annulée','Cancelled')},steps=['CONFIRMEE','PREPARATION','EXPEDIEE','EN_LIVRAISON','LIVREE'];if(q)document.getElementById('n').value=q;const money=n=>new Intl.NumberFormat('fr-FR').format(Number(n)||0)+' FCFA',safe=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));async function render(){const n=document.getElementById('n').value.trim(),out=document.getElementById('out');if(!n)return;out.innerHTML=`<div class="empty-state"><h3>${T('Recherche…','Searching…')}</h3><p>${T('Nous récupérons le statut de votre commande.','We are retrieving your order status.')}</p></div>`;try{const r=await fetch(API+'/orders/'+encodeURIComponent(n)),d=await r.json();if(!r.ok)throw new Error(d.error||T('Commande introuvable.','Order not found.'));const current=steps.indexOf(d.status),cancelled=d.status==='ANNULEE',items=(d.items||[]).map(i=>`<div class="summary-line"><span>${safe(i.product_name)} × ${Number(i.quantity)||0}</span><strong>${money((Number(i.unit_price_fcfa)||0)*(Number(i.quantity)||0))}</strong></div>`).join(''),track=steps.map((s,i)=>`<span class="${!cancelled&&current>=i?'done':''}">${labels[s]}</span>`).join('');out.innerHTML=`<div class="summary-card"><p class="eyebrow">${safe(d.order_number)}</p><h2>${labels[d.status]||safe(d.status)}</h2><div class="status-track">${track}</div>${cancelled?`<div class="state error">${T('Cette commande a été annulée.','This order has been cancelled.')}</div>`:''}<div class="order-meta"><p>${T('Total','Total')} : <strong>${money(d.total_fcfa)}</strong></p><p>${T('Paiement','Payment')} : <strong>${safe(d.payment_method||T('Non précisé','Not specified'))}</strong>${d.payment_status?` · ${safe(d.payment_status)}`:''}</p><p>${safe(d.name)} · ${safe(d.city)}</p><p>${safe(d.address)}</p></div><hr><h3>${T('Articles','Items')}</h3>${items||`<p class="muted">${T('Aucun article.','No items.')}</p>`}<p class="muted small">${T('Dernière vérification : ','Last checked: ')}${new Date().toLocaleString('fr-FR')}</p><button class="btn secondary" type="button" id="refresh">${T('Actualiser','Refresh')}</button></div>`;document.getElementById('refresh').onclick=render}catch(err){out.innerHTML=`<div class="state error">${safe(err.message)}</div>`}}document.getElementById('f').onsubmit=e=>{e.preventDefault();render()};if(q)render();setInterval(()=>{if(document.visibilityState==='visible'&&document.getElementById('n').value.trim())render()},30000);
</script><script src="secondary-i18n.js"></script></body></html>

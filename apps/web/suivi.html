<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suivi — EgonarMarket</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><div class="nav wrap"><a class="logo" href="index.html">Egonar<span>Market</span></a><nav><a href="index.html">Boutique</a><a href="panier.html">Panier</a></nav></div></header><main class="wrap section"><p class="eyebrow">SUIVI</p><h1>Suivre ma commande</h1><form id="f" class="search"><input id="n" placeholder="Ex. EG-20260910-ABC123" required><button>Rechercher</button></form><div id="out" class="track-out"></div></main><script>
const API='/api';const q=new URLSearchParams(location.search).get('order');if(q)document.getElementById('n').value=q;document.getElementById('f').onsubmit=async e=>{e.preventDefault();const n=document.getElementById('n').value.trim();const out=document.getElementById('out');out.innerHTML='<div class="empty-state">Recherche…</div>';try{const r=await fetch(API+'/orders/'+encodeURIComponent(n));const d=await r.json();if(!r.ok)throw new Error(d.error);out.innerHTML=`<div class="summary-card"><p class="eyebrow">${d.order_number}</p><h2>${d.status}</h2><p>Total : <strong>${new Intl.NumberFormat('fr-FR').format(d.total_fcfa)} FCFA</strong></p><p>${d.name} · ${d.city}</p><p>${d.address}</p></div>`}catch(err){out.innerHTML=`<div class="state error">${err.message}</div>`}};
</script></body></html>

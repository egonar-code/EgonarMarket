<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Suivi de commande EgonarMarket"><title>Suivi — EgonarMarket</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><div class="nav wrap"><a class="logo" href="index.html">Egonar<span>Market</span></a><nav><a href="index.html">Boutique</a><a href="panier.html">Panier</a></nav></div></header><main class="wrap section"><p class="eyebrow">SUIVI</p><h1>Suivre ma commande</h1><form id="f" class="search track-search"><input id="n" autocomplete="off" placeholder="Ex. EG-20260910-ABC123" required><button>Rechercher</button></form><div id="out" class="track-out"></div></main><script>
const API='/api';const labels={CONFIRMEE:'Commande confirmée',PREPARATION:'En préparation',EXPEDIEE:'Expédiée',EN_LIVRAISON:'En livraison',LIVREE:'Livrée',ANNULEE:'Annulée'};const q=new URLSearchParams(location.search).get('order');if(q)document.getElementById('n').value=q;document.getElementById('f').onsubmit=async e=>{e.preventDefault();const n=document.getElementById('n').value.trim(),out=document.getElementById('out');out.innerHTML='<div class="empty-state"><h3>Recherche…</h3><p>Nous récupérons le statut de votre commande.</p></div>';try{const r=await fetch(API+'/orders/'+encodeURIComponent(n)),d=await r.json();if(!r.ok)throw new Error(d.error||'Commande introuvable.');const items=(d.items||[]).map(i=>`<div class="summary-line"><span>${i.product_name} × ${i.quantity}</span><strong>${new Intl.NumberFormat('fr-FR').format(i.unit_price_fcfa*i.quantity)} FCFA</strong></div>`).join('');out.innerHTML=`<div class="summary-card"><p class="eyebrow">${d.order_number}</p><h2>${labels[d.status]||d.status}</h2><div class="status-track"><span class="done">Reçue</span><span class="${['CONFIRMEE','PREPARATION','EXPEDIEE','EN_LIVRAISON','LIVREE'].includes(d.status)?'done':''}">${labels[d.status]||d.status}</span></div><p>Total : <strong>${new Intl.NumberFormat('fr-FR').format(d.total_fcfa)} FCFA</strong></p><p>${d.name} · ${d.city}</p><p>${d.address}</p><hr><h3>Articles</h3>${items}</div>`}catch(err){out.innerHTML=`<div class="state error">${err.message}</div>`}};
</script></body></html>

services:
  - type: web
    name: egonarmarket-preview-live
    runtime: node
    plan: free
    branch: fix/supplier-ai-coach-integration
    buildCommand: npm install
    startCommand: npm run prepare && npm run firestore:migrate-if-enabled && npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: egonarmarket-preview-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        value: admin@egonarmarket.sn
      - key: ADMIN_PASSWORD
        sync: false
      - key: NODE_ENV
        value: production
      - key: DATA_BACKEND
        value: firestore
      - key: FIREBASE_SERVICE_ACCOUNT_FILE
        value: /etc/secrets/firebase-service-account.json
      - key: FIRESTORE_MIGRATE_ON_START
        value: "false"
      - key: DELIVERY_DAKAR_FCFA
        value: "1500"
      - key: DELIVERY_OTHER_FCFA
        value: "3000"

databases:
  - name: egonarmarket-preview-db
    plan: free
    databaseName: egonarmarket
    user: egonar

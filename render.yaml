services:
  - type: web
    name: egonarmarket-preview-live
    runtime: node
    plan: free
    branch: fix/supplier-ai-coach-integration
    buildCommand: npm install
    startCommand: npm run db:init && npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: egonarmarket-preview-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@egonarmarket.sn
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: DELIVERY_DAKAR_FCFA
        value: "1500"
      - key: DELIVERY_OTHER_FCFA
        value: "3000"

databases:
  - name: egonarmarket-preview-db
    plan: free
    databaseName: egonarmarket
    user: egonar
